# localLessonsGPT — application services (Docker)
# remoteLessonsGPT API — requires infra network from ../infra/docker-compose.yml
#
# Config: ../remote-lessons-gpt/.env (auth, index, workers)
# Start:  ./scripts/local up apps

name: lessons-gpt-apps

services:
  remote-api:
    build:
      context: ../remote-lessons-gpt
      dockerfile: Dockerfile
    container_name: lessons-gpt-remote-api
    env_file:
      - ../remote-lessons-gpt/.env
    environment:
      # Docker infra hostnames (override localhost URLs from remote .env)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lessons_gpt
      OPENSEARCH_URL: http://opensearch:9200
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_DATA_ROOT: /app/data
      API_CORS_ORIGINS: "*"
    ports:
      - "${REMOTE_API_HOST_PORT:-8081}:8080"
    volumes:
      - remote-api-data:/app/data
    networks:
      - lessons-gpt
    depends_on: []
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

networks:
  lessons-gpt:
    external: true
    name: lessons-gpt

volumes:
  remote-api-data:
