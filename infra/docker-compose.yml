# Shared infrastructure — PostgreSQL and OpenSearch
# Only remote-lessons-gpt connects to these services (via Docker network).
# Local extractors and admin UI must NOT access Postgres/OpenSearch directly.
#
# Start:  cd local-lessons-gpt && ./scripts/local up infra
# Stop:   cd local-lessons-gpt && ./scripts/local down infra

name: lessons-gpt-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: lessons-gpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lessons_gpt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lessons-gpt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lessons_gpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: lessons-gpt-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - lessons-gpt

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: lessons-gpt-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - lessons-gpt

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lessons-gpt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lessonsgpt.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lessons-gpt

networks:
  lessons-gpt:
    name: lessons-gpt
    driver: bridge

volumes:
  postgres-data:
  opensearch-data:
  pgadmin-data:
