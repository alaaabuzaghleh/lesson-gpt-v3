services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lessons_gpt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  api:
    build:
      context: ..
      dockerfile: pdf_codex_extractor/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lessons_gpt
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: school_book_content_v3
      EXTRACTOR_BACKEND: local
      VLM_BASE_URL: http://host.docker.internal:11434/v1
      VLM_MODEL: qwen2.5vl:7b
      API_DATA_ROOT: /app/data
      JWT_SECRET: change-me-in-production
      SUPER_ADMIN_EMAIL: superadmin@lessonsgpt.com
      SUPER_ADMIN_PASSWORD: SuperAdmin123!
      REMOTE_API_URL: ${REMOTE_API_URL:-}
      REMOTE_OPENSEARCH_URL: ${REMOTE_OPENSEARCH_URL:-}
      REMOTE_OPENSEARCH_INDEX: ${REMOTE_OPENSEARCH_INDEX:-school_book_content_v3}
    volumes:
      - api-data:/app/data
    depends_on:
      - postgres
      - opensearch

volumes:
  postgres-data:
  opensearch-data:
  api-data:
