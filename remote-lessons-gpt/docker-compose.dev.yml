# remoteLessonsGPT — local dev (Docker)
# Requires infra:  cd ../infra && docker compose up -d
# Config:          cp .env.example .env
# Start:           ./up.sh

name: lessons-gpt-remote

services:
  remote-api:
    build: .
    container_name: lessons-gpt-remote-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lessons_gpt
      OPENSEARCH_URL: http://opensearch:9200
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_DATA_ROOT: /app/data
      API_CORS_ORIGINS: "*"
    ports:
      - "${REMOTE_API_HOST_PORT:-8081}:8080"
    volumes:
      - remote-api-data:/app/data
    networks:
      - lessons-gpt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

networks:
  lessons-gpt:
    external: true
    name: lessons-gpt

volumes:
  remote-api-data:
