services:
  postgres:
    image: postgres:16-alpine
    container_name: lessons-gpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lessons_gpt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lessons_gpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:latest}
    container_name: school-books-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: ${OPENSEARCH_DASHBOARDS_IMAGE:-opensearchproject/opensearch-dashboards:latest}
    container_name: school-books-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

  api:
    build: .
    container_name: school-books-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lessons_gpt
      - VLM_BASE_URL=${DOCKER_VLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - VLM_API_KEY=${VLM_API_KEY:-EMPTY}
      - VLM_MODEL=${VLM_MODEL:-qwen2.5vl:7b}
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=${OPENSEARCH_INDEX:-school_book_content_v3}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-superadmin@lessonsgpt.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-SuperAdmin123!}
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_DATA_ROOT=/app/data
      - API_WORKER_COUNT=${API_WORKER_COUNT:-2}
      - API_MAX_UPLOAD_MB=${API_MAX_UPLOAD_MB:-1024}
      - MINERU_ENABLED=${MINERU_ENABLED:-true}
      - MINERU_REQUIRED=${MINERU_REQUIRED:-false}
      - MINERU_API_URL=${MINERU_API_URL:-}
      - MINERU_BACKEND=${MINERU_BACKEND:-pipeline}
      - MINERU_LANGUAGE=${MINERU_LANGUAGE:-arabic}
      - MINERU_PARSE_METHOD=${MINERU_PARSE_METHOD:-auto}
      - MINERU_TIMEOUT_SECONDS=${MINERU_TIMEOUT_SECONDS:-3600}
    ports:
      - "8080:8080"
    volumes:
      - book-api-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started

volumes:
  postgres-data:
  opensearch-data:
  book-api-data:
