# Standalone all-in-one stack (Postgres + OpenSearch + API in one compose file).
#
# For local dev with separated infra, use instead:
#   cd ../infra && ./up.sh
#   cd ../remote-lessons-gpt && cp .env.example .env && ./up.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: lessons-gpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lessons_gpt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lessons_gpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.17.1}
    container_name: lessons-gpt-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: lessons-gpt-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: lessons-gpt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lessonsgpt.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  remote-api:
    build: .
    container_name: lessons-gpt-remote-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lessons_gpt
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-school_book_content_v3}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@lessonsgpt.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-SuperAdmin123!}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_DATA_ROOT: /app/data
      API_WORKER_COUNT: ${API_WORKER_COUNT:-2}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - remote-api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_started

volumes:
  postgres-data:
  opensearch-data:
  pgadmin-data:
  remote-api-data:
